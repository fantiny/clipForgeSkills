[project]
name = "clipforge-skills"
version = "0.1.0"
description = "Local video production tools for portable Codex and Claude skills"
requires-python = ">=3.13,<3.14"
dependencies = [
    "jsonschema>=4.26.0",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
clipforge = "clipforge_skills.cli:main"

[build-system]
requires = ["uv_build==0.12.7"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]
