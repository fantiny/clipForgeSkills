name: Skill checks (engine integration requires access)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    outputs:
      engine_access: ${{ steps.access.outputs.available }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.7'
      - run: uv sync --frozen
      - name: Linux media tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Windows media tools
        if: runner.os == 'Windows'
        run: choco install ffmpeg --version=9.0.2 --yes --no-progress
      - run: uv run python tools/dev/install_skills.py --host both
      - run: uv run ruff check src --select F,C90 --config lint.mccabe.max-complexity=10
      - run: uv run python -c "import runpy; runpy.run_path('tools/dev/check.py')['check_skills']()"
      - name: Engine-independent contract and recovery tests
        run: uv run pytest tests/test_core.py tests/test_contracts.py tests/test_creative.py tests/test_review_batch.py tests/test_render_plan_directory.py tests/test_portability.py tests/test_skill_install.py tests/test_audio_platforms.py tests/test_engine_adapter.py tests/test_library.py tests/test_evidence.py tests/test_imports_reference_cli.py tests/test_presentation.py tests/test_timing.py tests/test_mixing.py tests/test_overlay_render.py -q
      - run: uv run python tools/clipforge.py doctor
      - run: uv run pip-audit --local
      - name: Report private engine availability
        id: access
        shell: bash
        env:
          UPSTREAM_TOKEN: ${{ secrets.CLIPFORGE_UPSTREAM_TOKEN }}
        run: |
          if [ -n "$UPSTREAM_TOKEN" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Full engine integration was NOT run: CLIPFORGE_UPSTREAM_TOKEN is not configured. Portable checks do not imply full pipeline acceptance.' >> "$GITHUB_STEP_SUMMARY"
          fi
  full-engine-integration:
    needs: portable-checks
    if: needs.portable-checks.outputs.engine_access == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: fantiny/clipforge
          ref: 77a7e73e1f898581d325f3070b574ea0894d8a76
          path: tmp/upstream-source
          token: ${{ secrets.CLIPFORGE_UPSTREAM_TOKEN }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.7'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - if: runner.os == 'Windows'
        run: choco install ffmpeg --version=9.0.2 --yes --no-progress
      - run: uv sync --frozen
      - run: uv run python tools/engine/bootstrap.py --source tmp/upstream-source
      - run: uv run python tools/dev/install_skills.py --host both
      - run: uv run python tools/dev/check.py
